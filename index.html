const INK='#1a1210';
function ink(g,p,w){g.strokeStyle=INK;g.lineWidth=w;g.lineJoin='round';g.lineCap='round';g.stroke(p);}
function cel(g,path,fn){g.save();g.clip(path);fn();g.restore();}
function radialShade(g,path,cx,cy,r0,r1,colorNear,colorFar){
  g.save();g.clip(path);
  const rg=g.createRadialGradient(cx,cy,r0,cx,cy,r1);
  rg.addColorStop(0,colorNear);rg.addColorStop(1,colorFar);
  g.fillStyle=rg;g.fillRect(0,0,800,800);
  g.restore();
}
function makeSkeleton(){

  head.lineTo(500,236);head.lineTo(520,320);head.lineTo(500,404);head.lineTo(438,458);
  head.lineTo(400,467);head.lineTo(362,458);head.lineTo(300,404);head.closePath();
  const jack=new Path2D();
  jack.moveTo(400,512);jack.bezierCurveTo(308,524,238,556,208,800);jack.lineTo(592,800);
  jack.bezierCurveTo(562,556,492,524,400,512);jack.closePath();
  const neck=new Path2D();neck.rect(368,440,64,90);
  const ear=new Path2D();ear.ellipse(276,348,17,27,0,0,7);
  const ear2=new Path2D();ear2.ellipse(524,348,17,27,0,0,7);
  return {head,jack,neck,ear,ear2};
}

  g.strokeStyle=INK;g.lineWidth=3;
  g.beginPath();g.ellipse(-18,0,20,12,0.4,0,7);g.stroke();
  g.beginPath();g.ellipse(18,0,20,12,-0.4,0,7);g.stroke();
  g.fillStyle=color;g.beginPath();g.arc(0,0,8,0,7);g.fill();g.stroke();

function hairLongWavy(g,hc,hl,withBow){
  const hair=new Path2D();
  hair.moveTo(292,278);hair.bezierCurveTo(282,182,325,157,400,157);

      for(let y=368;y<460;y+=18)for(let x=316;x<484;x+=18){g.beginPath();g.arc(x,y,4,0,7);g.fill();}});

const FEMALE_NAMES=['vika','viktoria','victoria','katya','ekaterina','nastya','anastasia','anna','masha',
  'maria','dasha','daria','olya','olga','sveta','svetlana','lena','elena','ira','irina','tanya','tatiana',
  'natasha','natalia','vera','alina','polina','kristina','julia','yulia','sofia','sonya','mila','amara',
  'keisha','zola','lele','aisha','angel','queen','love','lada','nadya','zoya'];
const MALE_NAMES=['ivan','petya','vasya','dmitry','dima','igor','sergey','andrey','alex','alexey','max',
  'maxim','nikita','anton','pavel','artem','denis','roman','oleg','boris','jamal','malik','kenji','yuki',
  'chen','darius','king','boss','danbao','samurai','wizard'];
function guessGender(username){
  const name=username.toLowerCase().replace(/[0-9_]+$/,'');
  if(FEMALE_NAMES.includes(name)) return 'f';
  if(MALE_NAMES.includes(name)) return 'm';
  if(/^[a-z]+$/.test(name) && name.length>=3 && /(a|ya|ia|na)$/.test(name)) return 'f';
  return null;
}
const FEMALE_HAIR_IDX=[6,7,8], MALE_HAIR_IDX=[0,1,2,3,4,5];

// === детерминированная сборка конфигурации персонажа по хэшу username ===
function cfgFromHash(username, hash, showLabel){
  const h=[hash,Math.floor(hash/7),Math.floor(hash/13),Math.floor(hash/29),Math.floor(hash/53),
    Math.floor(hash/89),Math.floor(hash/151),Math.floor(hash/211),Math.floor(hash/271),Math.floor(hash/331)];
  const gender=guessGender(username);
  let hairIdx;
  if(gender==='f'){hairIdx=FEMALE_HAIR_IDX[h[0]%FEMALE_HAIR_IDX.length];}
  else if(gender==='m'){hairIdx=MALE_HAIR_IDX[h[0]%MALE_HAIR_IDX.length];}
  else{hairIdx=h[0]%HAIRSTYLES.length;}
  const cfg={username,showLabel,hue:hash%360,skinIdx:h[5]%SKINS.length,hairIdx,eyeCol:eyeCols[h[6]%eyeCols.length]};
  const hs=HAIRSTYLES[hairIdx];
  if(hs.needsColor==='cap'||hs.needsColor==='propeller'){
    cfg.capIdx=h[1]%CAP_COLORS.length;
    if(hs.needsColor==='propeller') cfg.bladeIdx=h[7]%PROPELLER_BLADES.length;
  }else{cfg.hairColorIdx=h[1]%HAIR_COLORS.length;}
  if(h[2]%17===0){cfg.rainbowShirt=true;}else{cfg.shirtIdx=h[2]%SHIRT_COLORS.length;}
  cfg.glassesIdx=h[3]%GLASSES.length;
  cfg.printIdx=h[4]%PRINTS.length;
  const roll=h[8]%10;
  if(roll<2){cfg.maskIdx=1+(h[9]%(MASKS.length-1));}
  else{
    if(roll<4) cfg.beardIdx=1+(h[9]%(BEARD_COLORS.length-1));
    if(h[9]%12===0) cfg.rainbowTeeth=true;
  }
  return cfg;
}

}

function looksLikeRealWord(name){
  const letters=name.toLowerCase().replace(/[^a-zа-яё]/gi,'');
  if(!letters) return false;
  if(REAL_WORDS.has(letters)) return true;
  if(letters.endsWith('s') && REAL_WORDS.has(letters.slice(0,-1))) return true;
  return false;
}

// === ЦЕНОВАЯ СЕТКА ПЕРЕДЕЛАНА (2026-09-07) по прямой просьбе Angel: мини-апп — это МАССОВЫЙ,
// дешёвый доступный слой (в отличие от VIP-коллекции по 1000-2000 TON). Диапазон ~$2 (дёшево) до
// ~$20-30 (самые редкие настоящие короткие слова), курс на момент правки ~1 TON = $1.35. Раньше тут
// были цены 30-800 TON — это была VIP-логика по ошибке, для мини-аппа никогда не подходила.
// ГЛАВНЫЙ фактор всё ещё — настоящее слово или нет; длина 3-4 буквы — бонус сверху; цифры — скидка. ===
function calcPrice(username){
  const hasDigits=/\d/.test(username);
  const len=username.length;
  if(len<3) return null; // такой длины юзернеймов не существует вообще
  // Angel 2026-09-14: бонус за "настоящее слово" убран целиком (незачем было
  // грузить в контракт словарь из 568 слов ради него) -- цена зависит ТОЛЬКО
  // от длины. Синхронизировано с priceFor() в контракте
  // (status_avatars_collection.tact) — если меняешь одно, обязательно менять и другое.
  let base;
  if(len===3) base = 12;
  else if(len===4) base = 6;
  else base = 1;
  const ton=hasDigits?Math.round(base*0.6*10)/10:base;
  return {ton, hasDigits, len};
}

  // это правда, а для повторного кошелька честная цена всё равно появится на
  // следующем шаге, ДО того как что-либо спишется.
  if(freeRemainingCache!==null && freeRemainingCache>0n){

  }else{
    priceEl.textContent=`Цена: ${p.ton} TON${reason}`;

}

// Angel 2026-09-14: бесплатный toncenter жёстко лимитирует запросы -- один
// случайный 429 раньше тут же ронял цену в платный запасной вариант, даже
// когда человек реально имел право на бесплатный минт. Теперь пробуем
// несколько раз с паузой, как в деплой-скриптах, прежде чем сдаться.
async function runGetMethod(method, stack){
  for(let attempt=0; attempt<5; attempt++){
    const res=await fetch('https://toncenter.com/api/v2/jsonRPC',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:'1',jsonrpc:'2.0',method:'runGetMethod',
        params:{address:CONTRACT_ADDRESS,method,stack}})
    });
    if(res.status===429){
      await new Promise(r=>setTimeout(r,1200*(attempt+1)));
      continue;
    }
    const data=await res.json();
    if(!data.ok) throw new Error('toncenter error: '+JSON.stringify(data));
    return data.result.stack;
  }
  throw new Error('toncenter rate-limited after retries');
}

// Angel 2026-09-04: реальная цена (в т.ч. бесплатный минт) считается ТОЛЬКО
// в контракте -- локальный calcPrice() это лишь примерная подсказка ДО подключения
// кошелька. После подключения кошелька спрашиваем контракт напрямую (тот же
// getMintPrice(username, buyer), что использует бот/тесты), иначе бесплатные
// места (первые 100, один раз на кошелёк) никогда бы не сработали на сайте.
async function fetchRealPriceNanoton(username, buyerAddressRaw){
  const {beginCell,Address}=window.__ton;
  function stackSlice(cell){return ['tvm.Slice', cell.toBoc().toString('base64')];}
  const usernameCell=beginCell().storeStringTail(username).endCell();
  // Address.parse (не parseRaw!) -- некоторые кошельки могут отдавать адрес не
  // в чистом "0:hex" формате, а parseRaw на таком падал молча и цена уходила
  // в платный запасной вариант даже для бесплатных мест.
  const buyerCell=beginCell().storeAddress(Address.parse(buyerAddressRaw)).endCell();
  const stack=await runGetMethod('getMintPrice',[stackSlice(usernameCell),stackSlice(buyerCell)]);
  const raw=stack[0][1];
  const abs=raw.startsWith('-')?raw.slice(1):raw;
  return raw.startsWith('-') ? -BigInt(abs) : BigInt(abs);
}

// Angel 2026-09-14: чужой человек, увидев "до 6 TON" ДО подключения кошелька,
// пугается и уходит, даже если для него это реально бесплатно (первые 100).
// Глобальный остаток бесплатных мест (без адреса кошелька -- дешёвый вызов,
// без TupleBuilder) спрашиваем ОДИН раз при загрузке страницы и кэшируем, чтобы
// подсказка честно и уверенно писала "Бесплатно" для подавляющего большинства
// (первый минт с кошелька), а не пугала ценой раньше времени. Итоговая проверка
// (было ли УЖЕ у этого конкретного кошелька) всё равно происходит после
// подключения кошелька, в окне подтверждения -- см. fetchRealPriceNanoton.
let freeRemainingCache=null;
async function refreshFreeRemaining(){
  try{
    const stack=await runGetMethod('freeMintsRemaining',[]);
    const raw=stack[0][1];
    freeRemainingCache=BigInt(raw);
  }catch(e){ /* не смогли -- подсказка просто останется на резервном тексте с ценой */ }
}
refreshFreeRemaining();

function easeOutCubic(t){return 1-Math.pow(1-t,3);}

const confirmBox=document.getElementById('confirmBox'),confirmText=document.getElementById('confirmText'),
  confirmYes=document.getElementById('confirmYes'),confirmNo=document.getElementById('confirmNo');

function spin(username){
  const key=username.toLowerCase();
  if(username.length<3){
    statusEl.textContent='❌ Минимум 3 буквы — короче юзернеймов не существует';
    statusEl.style.color='#ff5555';
    return;
  }
  if(TAKEN_DEMO.includes(key)){
    statusEl.textContent='❌ @'+username+' уже занят! Попробуй другой (например, добавь цифру)';
    statusEl.style.color='#ff5555';
    return;
  }
  if(isBrandOrFigure(username)){
    statusEl.textContent='👑 @'+username+' — топовое имя, недоступно для автогенерации';
    statusEl.style.color='#ff9955';
    return;
  }
  const ours=checkOurPremium(key);
  if(ours){
    if(ours.listed){statusEl.innerHTML=`👑 @${username} — уже продаётся на Getgems за ${ours.price}! <a href="${ours.url}" target="_blank" style="color:#4fc3ea">Купить там</a>`;}
    else{statusEl.textContent=`👑 @${username} — топовое имя, недоступно для автогенерации`;}
    statusEl.style.color='#ff9955';
    return;
  }
  if(MINTED_LOCK.has(key)){
    statusEl.textContent='🔒 @'+username+' уже заминчен ТОБОЙ — результат зафиксирован навсегда, второй раз получить другого нельзя';
    statusEl.style.color='#ffd23f';
    return;
  }
  const price=calcPrice(username);
  if(price.reserved){
    statusEl.textContent='👑 @'+username+' — топовое 3-буквенное слово, в резерве, недоступно для автоминта';
    statusEl.style.color='#ff9955';
    return;
  }
  statusEl.textContent='';
  // Angel 2026-09-04: сначала показываем крутящуюся карточку (интерес!),
  // кошелёк подключаем только ПОСЛЕ, когда человек уже увидел результат.
  revealThenConfirm(username,key,price);
}

function revealThenConfirm(username,key,price){
  stopShowcase();
  glowEl.classList.remove('on');
  statusEl.style.color='';
  statusEl.textContent='Определяем твою карточку...';
  const finalHash=hashOf(username.toLowerCase());
  const DURATION=2600;
  const start=performance.now();
  spinning=true;btn.disabled=true;
  let lastStepTime=0;
  function frame(now){
    const elapsed=now-start;
    const t=Math.min(elapsed/DURATION,1);
    if(t<1){
      const eased=easeOutCubic(t);
      const interval=40+eased*260;
      if(now-lastStepTime>interval){
        lastStepTime=now;
        const randHash=Math.floor(Math.random()*999999);
        render(c, cfgFromHash(username, randHash, false));
      }
      requestAnimationFrame(frame);
    }else{
      render(c, cfgFromHash(username, finalHash, true));
      spinning=false;btn.disabled=false;
      statusEl.textContent = (freeRemainingCache!==null && freeRemainingCache>0n)
        ? 'Нравится? Забери себе 🎁 бесплатно 👇'
        : 'Нравится? Забери себе за '+price.ton+' TON 👇';
      glowEl.classList.add('on');
      stageEl.style.transform='scale(1.06)';
      setTimeout(()=>{stageEl.style.transform='scale(1)';},60);
      showConfirmBox(username,key,price);
    }
  }
  requestAnimationFrame(frame);
}

function showConfirmBox(username,key,price){
  initTonConnect();
  { const dbg=document.getElementById('debugLine'); if(dbg) dbg.textContent=''; }
  let realPriceNanoton=null; // заполняется после подключения кошелька -- см. fetchRealPriceNanoton
  const stillFree=freeRemainingCache!==null && freeRemainingCache>0n;
  confirmText.textContent=walletConnected()
    ? `Проверяем реальную цену для твоего кошелька...`
    : stillFree
      ? `🎁 @${username} бесплатно! (акция: первые 100 карточек, 1 раз на кошелёк). Подключи TON-кошелёк, чтобы забрать — спишется только газ ~0.02 TON.`
      : `${price.ton} TON за @${username}. Для минта нужно подключить TON-кошелёк.`;
  confirmYes.disabled=walletConnected();
  confirmYes.textContent=walletConnected() ? 'Подтвердить' : '🔗 Подключить кошелёк и оплатить';
  confirmBox.classList.add('show');
  btn.disabled=true;

  // Angel 2026-09-14: известный неисправленный баг TonConnect внутри Telegram
  // WebView -- экран "прыгает" между Telegram и Tonkeeper во время ввода
  // пароля и транзакция срывается с "User declined", хотя пользователь ничего
  // не отклонял (github.com/ton-connect/sdk/issues/302, до сих пор open).
  // Обходной путь: предложить открыть ТУ ЖЕ страницу в обычном браузере
  // телефона (с юзернеймом в ссылке), где Tonkeeper работает без конфликта.
  if(!walletConnected() && window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData){
    openBrowserBtn.style.display='block';
    openBrowserBtn.onclick=()=>{
      // Angel 2026-09-14: без метки версии эта ссылка ВСЕГДА одинаковая для
      // одного и того же username -- браузер кешировал её один раз и потом
      // упорно показывал старый код независимо от того, что опубликовано.
      const url='https://tima224488-lgtm.github.io/status-avatars-app/mint.html?u='+encodeURIComponent(username)+'&v='+Date.now();
      window.Telegram.WebApp.openLink(url,{try_instant_view:false});
    };
  }else{
    openBrowserBtn.style.display='none';
  }

  async function refreshRealPrice(addr){
    confirmText.textContent='Проверяем реальную цену для твоего кошелька...';
    confirmYes.disabled=true;
    // Angel 2026-09-14: временная отладочная строка -- показываем на экране
    // сам адрес и вычисленное число, чтобы увидеть правду с телефона Angel
    // вместо очередного раунда гаданий. Убрать после того как найдём причину.
    const dbg=document.getElementById('debugLine');
    function dbgLog(msg){ if(dbg) dbg.textContent += (dbg.textContent?' | ':'')+msg; }
    dbgLog('addr='+addr);
    try{
      realPriceNanoton=await fetchRealPriceNanoton(username.toLowerCase(),addr);
      dbgLog('raw='+realPriceNanoton.toString());
      if(realPriceNanoton<0n){
        // контракт вернул -1 (защитный сигнал "имя невалидно" из getMintPrice)
        confirmText.textContent=`@${username} — недопустимое имя для контракта. Попробуй другое.`;
        confirmYes.disabled=true;
        return;
      }
      confirmText.textContent = realPriceNanoton===0n
        ? `🎁 Бесплатно! @${username} — спишется только газ (~0.02 TON). Подтвердить?`
        : `Подтвердить транзакцию: ${(Number(realPriceNanoton)/1e9)} TON за @${username}?`;
      confirmYes.disabled=false;
      confirmYes.textContent='Подтвердить';
    }catch(e){
      // не смогли спросить контракт -- безопасный вариант: берём цену по
      // формуле с сайта (контракт сам вернёт лишнее, если реально бесплатно).
      // Angel 2026-09-14: раньше причина пряталась, теперь показываем её же,
      // чтобы не гадать при повторных жалобах.
      dbgLog('ERROR='+(e&&e.stack?e.stack:(e&&e.message?e.message:e)));
      confirmText.textContent=`Не удалось проверить точную цену (${e&&e.message?e.message:e}), спишем по стандартному тарифу: ${price.ton} TON за @${username} (лишнее контракт вернёт автоматически). Подтвердить?`;
      confirmYes.disabled=false;
      confirmYes.textContent='Подтвердить';
    }
  }

  if(walletConnected()) refreshRealPrice(tonConnectUI.account.address);

  confirmYes.onclick=async ()=>{
    const ui=initTonConnect();
    if(!walletConnected()){
      confirmYes.disabled=true;
      confirmYes.textContent='🔗 Открываем кошелёк...';
      try{
        await ui.connectWallet();
      }catch(e){
        confirmText.textContent='Не удалось подключить кошелёк. Попробуй ещё раз.';
        confirmYes.disabled=false;
        confirmYes.textContent='🔗 Подключить кошелёк и оплатить';
        return;
      }
      await refreshRealPrice(ui.account.address);
      return; // подключились -- следующий тап реально отправит транзакцию
    }
    confirmYes.disabled=true;
    confirmYes.textContent='Отправляем...';
    try{
      if(!window.__tonReady) throw new Error('ton core not loaded yet');
      const {beginCell}=window.__ton;
      const usedPriceNanoton = realPriceNanoton!==null ? realPriceNanoton : BigInt(Math.round(price.ton*1e9));
      const totalNanoton=usedPriceNanoton+DEPLOY_GAS_NANOTON;
      { const dbg=document.getElementById('debugLine');
        if(dbg) dbg.textContent += (dbg.textContent?' | ':'')+'SENDING: realPriceNanoton='+(realPriceNanoton===null?'null':realPriceNanoton.toString())+' used='+usedPriceNanoton.toString()+' total='+totalNanoton.toString(); }
      const body=beginCell().storeUint(MINT_OPCODE,32).storeUint(BigInt(Date.now()),64).storeStringRefTail(username.toLowerCase()).endCell();
      const boc=body.toBoc().toString('base64');
      // Angel 2026-09-14: TonConnect resolves sendTransaction as soon as the
      // WALLET accepts/signs it -- это НЕ гарантия, что минт реально прошёл
      // в контракте (уже был случай "Готово!" на сайте при нулях в блокчейне).
      // Поэтому до победного текста реально спрашиваем блокчейн.
      let beforeIndex=null;
      try{ const s=await runGetMethod('get_collection_data',[]); beforeIndex=BigInt(s[0][1]); }catch(e){}
      await ui.sendTransaction({
        network:'-239', // mainnet
        validUntil:Math.floor(Date.now()/1000)+300,
        messages:[{address:CONTRACT_ADDRESS,amount:totalNanoton.toString(),payload:boc}]
      });
      confirmBox.classList.remove('show');
      btn.disabled=false;
      statusEl.style.color='';
      statusEl.textContent='Кошелёк отправил транзакцию, ждём подтверждения в блокчейне...';
      let confirmed=(beforeIndex===null); // если не смогли узнать индекс заранее -- не блокируем, просто доверяем кошельку
      for(let i=0;i<15 && !confirmed;i++){
        await new Promise(r=>setTimeout(r,3000));
        try{
          const s=await runGetMethod('get_collection_data',[]);
          const afterIndex=BigInt(s[0][1]);
          if(afterIndex>beforeIndex) confirmed=true;
        }catch(e){}
      }
      if(confirmed){
        MINTED_LOCK.add(key);
        statusEl.textContent='✅ Готово! @'+username+' уже в твоём кошельке';
      }else{
        statusEl.textContent='Кошелёк отправил транзакцию, но подтверждения из блокчейна пока нет. Проверь баланс/NFT через минуту — если ничего не изменилось, попробуй ещё раз.';
        statusEl.style.color='#ff9955';
      }
    }catch(e){
      // Angel 2026-09-14: раньше тут был общий текст "попробуй ещё раз" без
      // причины -- теперь показываем настоящую ошибку от кошелька, чтобы
      // не гадать вслепую при повторных жалобах.
      const reason = (e && e.message) ? e.message : String(e);
      confirmText.textContent='Ошибка: '+reason+'. Попробуй ещё раз.';
      confirmYes.disabled=false;
      confirmYes.textContent='Подтвердить';
    }
  };
  confirmNo.onclick=()=>{
    confirmBox.classList.remove('show');
    btn.disabled=false;
    statusEl.textContent='Заминти, если понравилось — просто нажми ещё раз';statusEl.style.color='#ff9955';
  };
}

btn.onclick=()=>{const v=input.value.trim();if(!v||spinning)return;spin(v);};
input.addEventListener('keydown',e=>{if(e.key==='Enter')btn.click();});
// username может содержать ТОЛЬКО латинские буквы и цифры — таковы реальные правила Telegram
// (баг найден Angel 2026-09-04: раньше регулярка ошибочно разрешала ещё и кириллицу а-яА-ЯёЁ)
// БАГ найден Angel 2026-09-14: контракт принимает ТОЛЬКО строчные буквы
// (validateAndHash/getMintPrice возвращают ошибку на любую заглавную), а поле
// ввода позволяло их печатать -- из-за этого реальная цена не считалась
// (getMintPrice видел "неверное имя"), и минт с любой заглавной буквой был
// обречён на провал ещё до подписи в кошельке. Теперь просто не даём вводить
// заглавные вообще, чтобы то, что видно на экране, ВСЕГДА совпадало с тем,
// что реально уходит в контракт.
function sanitizeUsername(){
  const clean=input.value.replace(/[^a-zA-Z0-9]/g,'').toLowerCase();
  if(clean!==input.value) input.value=clean;
}
input.addEventListener('input',()=>{
  sanitizeUsername();
  updatePrice();
  if(input.value.trim()){stopShowcase();drawEmptyPlaceholder();}
  else if(!spinning){startShowcase();}
});

// Angel 2026-09-14: если пришли сюда по ссылке из кнопки "Открыть в браузере
// для оплаты" (обход бага TonConnect+Telegram) -- имя уже известно, не
// заставляем вводить его заново, сразу показываем результат и переходим к оплате.
(function(){
  const params=new URLSearchParams(location.search);
  const u=params.get('u');
  if(u){
    const clean=u.replace(/[^a-zA-Z0-9]/g,'').toLowerCase();
    if(clean.length>=3){
      input.value=clean;
      setTimeout(()=>{ refreshFreeRemaining().then(()=>btn.click()); },300);
    }
  }
})();
</script>
